name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This package has zero dependencies, so no npm install is needed.
      # The build artifact is committed, so CI rebuilds it and asserts the
      # result is byte-identical, catching "edited src but forgot to build".
      - name: Build
        run: node scripts/build.mjs

      - name: Build output is committed
        run: git diff --exit-code -- client/client.js

      # 19 checks: factory contract, four inlined modules, dual-theme CSS,
      # light/dark key parity, idempotent injection and teardown, apply fault
      # tolerance, slot declarations, React-missing degradation, three-place
      # version consistency, manifest.
      - name: Verify
        run: node test/run-all.mjs

      # Generic manifest check: reads the package's own name from
      # package.json instead of hard-coding it, so copying this workflow to a
      # sibling plugin cannot silently assert the wrong package.
      - name: Manifest sanity
        run: |
          node -e "
          const p = require('./package.json');
          const dir = process.cwd().split(/[\\\\/]/).pop();
          if (p.name !== dir) throw new Error('package name ' + p.name + ' does not match directory ' + dir);
          if (p.dsh.client.platform !== 'web') throw new Error('bad platform');
          if (!p.dsh.client.inject.includes('@deepseek-ai/dsh-client-ui-theme')) throw new Error('missing ui-theme inject');
          if (!p.dsh.bundle || !p.dsh.bundle.patch) throw new Error('missing dsh.bundle.patch');
          console.log('manifest ok:', p.name, p.version);
          "
